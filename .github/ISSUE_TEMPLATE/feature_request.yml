name: Feature request
description: Suggest an idea for Relook
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or situation, not just the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This idea keeps everything on the user's computer (no uploads, accounts or tracking).
