<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Message</title>
<style>
:root { --bg: #ffffff; --line: #e2e5e9; --text: #1c222a; --muted: #6a7380; --accent: #2481cc; --chip: #eef1f4; --warn: #9a6700; }
/* Dark tokens: chosen by the app (data-theme), or by the OS when no app sets it. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) { --bg: #161b21; --line: #262d36; --text: #e5e8ec; --muted: #8b95a2; --accent: #52a7e8; --chip: #1f252d; --warn: #d9a441; }
}
:root[data-theme="dark"] { --bg: #161b21; --line: #262d36; --text: #e5e8ec; --muted: #8b95a2; --accent: #52a7e8; --chip: #1f252d; --warn: #d9a441; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
.wrap { padding: 18px 20px 40px; }
.head { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; margin-bottom: 10px; }
.from { font-weight: 700; font-size: 16px; }
.when, .fwd { color: var(--muted); font-size: 13px; }
.fwd { font-style: italic; }
.acts { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }
.btn { border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 6px; padding: 4px 10px; font: inherit; font-size: 12.5px; cursor: pointer; text-decoration: none; display: inline-block; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.media img, .media video { max-width: 100%; max-height: 66vh; border-radius: 8px; display: block; background: #000; }
.media audio { width: 100%; margin-top: 8px; }
.media iframe { width: 100%; height: 72vh; border: 1px solid var(--line); border-radius: 8px; }
.missing { color: var(--warn); background: var(--chip); border-radius: 8px; padding: 10px 12px; font-size: 13px; }
.file { display: flex; gap: 12px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.tag { width: 44px; height: 44px; border-radius: 7px; background: var(--chip); color: var(--muted); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex: none; }
.muted { color: var(--muted); font-size: 12.5px; }
.text { white-space: pre-wrap; word-wrap: break-word; font-size: 15px; margin-top: 14px; }
.text a, .lk { color: var(--accent); cursor: pointer; text-decoration: underline; word-break: break-all; }
.sec { margin-top: 20px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.link { display: flex; gap: 8px; align-items: center; justify-content: space-between; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-top: 6px; }
.link .u { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.link .d { font-weight: 600; }
.empty { color: var(--muted); padding: 60px 30px; text-align: center; }
</style>
</head>
<body>
<div id="root" class="empty">Select a message, photo, video or link on the left.</div>
<script>
"use strict";
const host = window.relookHost || (window.chrome && window.chrome.webview);
const post = (m) => host && host.postMessage(m);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let current = null;

function label(md) { return { photo: "Photo", video: "Video", audio: md.voice ? "Voice message" : "Audio", pdf: "PDF", file: "File" }[md.type] || "File"; }
function domain(u) { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return u; } }

function render(m) {
  current = m;
  const root = document.getElementById("root");
  if (!m) { root.className = "empty"; root.textContent = "Select a message, photo, video or link on the left."; return; }
  root.className = "wrap";
  let h = `<div class="head"><span class="from">${esc(m.from || "Unknown")}</span>` +
    `<span class="when">${esc(m.t ? new Date(m.t).toLocaleString(undefined, { dateStyle: "full", timeStyle: "medium" }) : "")}</span>` +
    (m.fwd ? `<span class="fwd">Forwarded from ${esc(m.fwd)}</span>` : "") + `</div><div class="acts">`;
  if (m.showContext) h += `<button class="btn" data-act="context">Show in conversation</button>`;
  if (m.reply) h += `<button class="btn" data-act="reply">Go to replied message</button>`;
  if (m.text) h += `<button class="btn" data-act="copy">Copy text</button>`;
  h += `</div>`;

  const md = m.media;
  if (md) {
    if (!md.url) h += `<div class="media"><div class="missing">${esc(label(md))} “${esc(md.title)}” isn't in this export. Telegram skipped it, usually because of the export's size or type settings.</div></div>`;
    else if (md.type === "photo") h += `<div class="media"><img src="${esc(md.url)}" alt=""></div>`;
    else if (md.type === "video") h += `<div class="media"><video src="${esc(md.url)}" ${md.poster ? `poster="${esc(md.poster)}"` : ""} controls autoplay playsinline></video></div>`;
    else if (md.type === "audio") h += `<div class="media"><div class="file"><div class="tag">${md.voice ? "VOICE" : "AUD"}</div><div><b>${esc(md.voice ? "Voice message" : md.title)}</b><div class="muted">${esc(md.status)}</div></div></div><audio src="${esc(md.url)}" controls autoplay></audio></div>`;
    else if (md.type === "pdf") h += `<div class="media"><iframe src="${esc(md.url)}"></iframe></div>`;
    else h += `<div class="media"><div class="file"><div class="tag">FILE</div><div><b>${esc(md.title)}</b><div class="muted">${esc(md.status)}</div></div></div></div>`;
  }

  if (m.text) {
    let t = esc(m.text);
    m.links.forEach((u, k) => { t = t.split(esc(u)).join(`<a data-link="${k}">${esc(u)}</a>`); });
    h += `<div class="text">${t}</div>`;
  }
  if (m.links && m.links.length) {
    h += `<div class="sec">Links (click to open here)</div>` + m.links.map((u, k) =>
      `<div class="link"><div class="u"><span class="lk" data-link="${k}"><span class="d">${esc(domain(u))}</span> · ${esc(u)}</span></div>` +
      `<button class="btn" data-ext="${k}" title="Open in your default browser">Browser</button></div>`).join("");
  }
  root.innerHTML = h;
  window.scrollTo(0, 0);
}

document.addEventListener("click", (e) => {
  if (!current) return;
  const l = e.target.closest("[data-link]");
  if (l) { post({ type: "openLink", url: current.links[+l.dataset.link] }); return; }
  const x = e.target.closest("[data-ext]");
  if (x) { post({ type: "openExternal", url: current.links[+x.dataset.ext] }); return; }
  const a = e.target.closest("[data-act]");
  if (!a) return;
  if (a.dataset.act === "copy") navigator.clipboard && navigator.clipboard.writeText(current.text);
  if (a.dataset.act === "context") post({ type: "jump", chat: current.chat, id: current.id });
  if (a.dataset.act === "reply") post({ type: "jump", chat: current.chat, id: current.reply });
});

if (host) {
  host.addEventListener("message", (e) => {
    const d = e.data;
    if (d && d.type === "appearance") { document.documentElement.dataset.theme = d.dark ? "dark" : "light"; return; }
    render(d);
  });
  post({ type: "paneReady" });
}
window.__render = render;   // hook for automated tests
</script>
</body>
</html>
