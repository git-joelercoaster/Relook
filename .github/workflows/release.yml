# Builds Relook for Windows, macOS and Linux and attaches the installers to a GitHub release.
# Run it by pushing a version tag:   git tag v0.2.0 && git push origin v0.2.0
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and upload to the release draft
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned builds. See the README for what users will see on first launch.
          CSC_IDENTITY_AUTO_DISCOVERY: false
